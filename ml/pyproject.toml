[project]
name = "wattwatch-ml"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["wattwatch_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["wattwatch_ml", "app"]  # app: backend code used by evaluation scripts
