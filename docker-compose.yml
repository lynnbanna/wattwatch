services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wattwatch
      POSTGRES_PASSWORD: wattwatch
      POSTGRES_DB: wattwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattwatch -d wattwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://wattwatch:wattwatch@db:5432/wattwatch
      CORS_ORIGINS: '["http://localhost:3000"]'
      LOG_LEVEL: INFO
      # Real model; run `python backend/scripts/fetch_model.py` first, or set VISION_MODEL=stub.
      VISION_MODEL: ${VISION_MODEL:-unet}
      VISION_MODEL_PATH: /app/models/roof_unet_r18_gsd015_v0.1.0.onnx
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./models:/app/models:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"  # detect file changes on Windows/macOS bind mounts
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api

volumes:
  pgdata:
